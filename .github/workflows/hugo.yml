name: Build and deploy Hugo site to Pages

on:
  push:
    branches: ["main"]
  # Validate on PRs too: the build is the only thing that catches a broken
  # site before it reaches main, where the next push deploys it.
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Deployments serialise on one group so they never overlap. PR validation
  # builds deploy nothing, so they get a per-branch group instead and a new
  # push supersedes the run it replaces.
  group: ${{ github.event_name == 'pull_request' && format('pr-{0}', github.head_ref) || 'pages' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  HUGO_VERSION: 0.166.0
  # Hugo shells out to this to render .adoc content (config/_default/markup.toml).
  ASCIIDOCTOR_VERSION: 2.0.26
  # Asciidoctor highlights .adoc code blocks with this.
  ROUGE_VERSION: 5.1.0

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Install Hugo CLI
        run: |
          curl -sL "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.deb" -o hugo.deb
          sudo dpkg -i hugo.deb

      - name: Install Asciidoctor
        run: |
          sudo gem install asciidoctor -v "${ASCIIDOCTOR_VERSION}" --no-document
          sudo gem install rouge -v "${ROUGE_VERSION}" --no-document

      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      # Resolves the Pages URL to build against. There is no deployment behind
      # a pull request, so this is skipped there and the build falls back to
      # the baseURL in config/_default/hugo.toml.
      - name: Setup Pages
        id: pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Build with Hugo
        env:
          HUGO_ENVIRONMENT: production
          HUGO_ENV: production
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ -n "${BASE_URL}" ]; then
            hugo --gc --minify --baseURL "${BASE_URL}/"
          else
            hugo --gc --minify
          fi

      - name: Upload artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./public

  deploy:
    # Pull requests validate the build only; nothing is published until the
    # change is on main.
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
