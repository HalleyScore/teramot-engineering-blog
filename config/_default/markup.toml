# -- Markup --
# These settings are required for the theme to function.

[goldmark]
  [goldmark.parser]
    wrapStandAloneImageWithinParagraph = false

    [goldmark.parser.attribute]
      block = true

  [goldmark.renderer]
    unsafe = true

  [goldmark.extensions]
    [goldmark.extensions.passthrough]
      enable = true
      [goldmark.extensions.passthrough.delimiters]
        block = [['\[', '\]'], ['$$', '$$']]
        inline = [['\(', '\)']]

[highlight]
  noClasses = false

[tableOfContents]
  startLevel = 2
  endLevel = 4

# -- AsciiDoc --
# Hugo has no built-in AsciiDoc parser: it shells out to the external
# `asciidoctor` binary, which must be installed locally and in CI (see
# .github/workflows/hugo.yml). The binary also has to be allowed in
# config/_default/security.toml.

[asciidocExt]
  # Resolve include:: and image:: relative to the .adoc file, so page bundles
  # (content/posts/<slug>/index.adoc) can reference their own assets.
  workingFolderCurrent = true
  # Let Blowfish render the TOC from .TableOfContents instead of embedding
  # Asciidoctor's own. Keep false to match the Markdown posts.
  preserveTOC = false
  # Fail the build on Asciidoctor warnings (unresolved xrefs, missing includes)
  # rather than publishing a broken page. Valid values are "fatal" and "warn".
  failureLevel = "warn"

  [asciidocExt.attributes]
    # Asciidoctor must be asked to build a TOC before Hugo can lift it into
    # .TableOfContents; unlike Markdown, Hugo does not derive one itself.
    # With preserveTOC = false above, Hugo strips it from the body and hands
    # it to the theme, so Blowfish renders it exactly as on Markdown posts.
    toc = "auto"
    # GitHub-style heading anchors (#my-heading), matching Goldmark's output.
    # Asciidoctor's default would be #_my_heading.
    idprefix = ""
    idseparator = "-"
    # Enable kbd:[], btn:[] and menu:[] macros.
    experimental = ""
    # Syntax highlighting. Hugo's Chroma never sees AsciiDoc content, so
    # Asciidoctor highlights it with Rouge (a separate gem -- see the README
    # and .github/workflows/hugo.yml). Rouge emits the same Pygments token
    # classes as Chroma; assets/css/custom.css colours them to match.
    source-highlighter = "rouge"
    # Emit token classes rather than inline styles, so light/dark theming
    # stays in CSS. Inline styles could not follow the appearance switcher.
    rouge-css = "class"
