# -- Security --
# Hugo refuses to run external binaries that are not on this allowlist, and
# setting `allow` replaces the default list rather than extending it. The
# entries below are Hugo 0.162.0's defaults plus `asciidoctor`, which Hugo
# shells out to when rendering .adoc content (see markup.toml).
#
# Check the current defaults against a new Hugo with:
#   hugo config --format toml | sed -n '/\[security\]/,/^\[[a-z]/p'

[exec]
  allow = [
    '^(dart-)?sass(-embedded)?$',
    '^go$',
    '^git$',
    '^node$',
    '^postcss$',
    '^tailwindcss$',
    '^asciidoctor$',
  ]
